# https://docs.safetycli.com/safety-docs/administration/safety-policy-files
security:
  ignore-cvss-severity-below: 0
  ignore-cvss-unknown-severity: false
  ignore-vulnerabilities:
    42194:
      reason: |
        SQLAlchemy-Utils issue unresolved since 2015.
        https://github.com/kvesteri/sqlalchemy-utils/issues/166
    51668:
      reason: |
        major version change sqlalchemy 2.0.0+
        not able to update until zope and ziggurat bump to provide releases
        https://github.com/sqlalchemy/sqlalchemy/pull/8563

  continue-on-vulnerability-error: false
